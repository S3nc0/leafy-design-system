<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leafy · ES module example</title>
<link rel="stylesheet" href="../css/leafy.css">
<!-- In an app with a bundler you import "leafy-web" from npm; here an import map stands in for it. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "leafy-web": "../js/leafy.js"
  }
}
</script>
<style>
  main { box-sizing: border-box; max-width: 640px; margin: 0 auto; padding: var(--space-8) var(--space-4); display: flex; flex-direction: column; gap: var(--space-5); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { createElement as h, useState } from 'react';
  import { createRoot } from 'react-dom/client';
  import { Button, Switch, Tag, TextField, Notification, sound } from 'leafy-web';

  function App() {
    const [frost, setFrost] = useState(true);
    const [target, setTarget] = useState('30');
    const invalid = !(Number(target) >= 0 && Number(target) <= 100);
    return h('main', null,
      h('h1', { className: 'lf-headline-small', style: { margin: 0 } }, 'Zone B4 settings'),
      h('div', { className: 'row' },
        h(Tag, { type: 'success', icon: 'check_circle' }, 'Healthy'),
        h(Tag, { type: 'info' }, 'Firmware 2.4')),
      h(Switch, { label: 'Frost alerts', checked: frost, onChange: (e) => setFrost(e.target.checked) }),
      h(TextField, {
        variant: 'stacked', label: 'Target moisture (%)', value: target, onChange: (e) => setTarget(e.target.value),
        error: invalid, supportingText: invalid ? 'Enter a value from 0 to 100' : 'Runs start when moisture falls below this',
      }),
      h('div', { className: 'row' },
        // Product code plays outcomes; components play their own events.
        h(Button, { disabled: invalid, onClick: () => sound.play('success') }, 'Save'),
        h(Button, { variant: 'text' }, 'Cancel')),
      h(Notification, { kind: 'info', title: 'Imported as an ES module' }, 'This page loads Leafy with import, the way a bundler would.'));
  }

  createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
